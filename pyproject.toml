[project]
name = "sleeperffl"
version = "0.1.0"
description = "Draft assistant and waiver watcher for a Sleeper fantasy football league"
requires-python = ">=3.11"
dependencies = [
    "httpx==0.28.1",
    "rich==15.0.0",
    "typer==0.27.2",
]

[project.scripts]
sleeperffl = "sleeperffl.cli:app"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "respx==0.23.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sleeperffl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
